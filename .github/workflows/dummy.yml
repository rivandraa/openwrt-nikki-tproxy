name: release nikki fixed core Mihomo

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build & Upload
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Buat dummy ZIP
        run: |
          mkdir -p out
          echo "Dummy data" > out/dummy.txt
          zip -j "out/Nikki_TProxy_v1.24.2-Mod-r1_Nikki_v1.19.13-Mod-r2_aarch64_generic.zip" out/dummy.txt

      - name: Upload ZIP ke Telegram (MarkdownV2)
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          set -e

          # ----- konfigurasi (ganti sesuai kebutuhan) -----
          ORIGINAL_FILE="out/Nikki_TProxy_v1.24.2-Mod-r1_Nikki_v1.19.13-Mod-r2_aarch64_generic.zip"
          VER_LUCI="v1.24.2-Mod-r1"
          VER_NIKKI="v1.19.13-Mod-r2"
          ARCH="aarch64_generic"
          BRANCH="openwrt-24.10"
          # ------------------------------------------------

          echo "📦 Asli: $ORIGINAL_FILE"

          # fungsi escape untuk Telegram MarkdownV2
          escape_md() {
            printf '%s' "$1" | sed -E 's/([_*\[\]()~`>#+\-=|{}.!])/\\\1/g'
          }

          VER_LUCI_ESC=$(escape_md "$VER_LUCI")
          VER_NIKKI_ESC=$(escape_md "$VER_NIKKI")
          ARCH_ESC=$(escape_md "$ARCH")
          BRANCH_ESC=$(escape_md "$BRANCH")
          FILE_ESC=$(escape_md "$(basename "$ORIGINAL_FILE")")

          # buat caption dengan format aman
          CAPTION=$(printf '🎉 *Release*\n\n🆎 luci-app-nikki : `%s`\n🧩 nikki : `%s`\n📦 Arch : `%s`\n🌿 Branch : `%s`\n🚀 File : `%s`' \
            "$VER_LUCI_ESC" "$VER_NIKKI_ESC" "$ARCH_ESC" "$BRANCH_ESC" "$FILE_ESC")

          # pastikan nama file tidak kepanjangan
          FILENAME="$(basename "$ORIGINAL_FILE")"
          MAX_LEN=64
          if [ ${#FILENAME} -gt $MAX_LEN ]; then
            EXT="${FILENAME##*.}"
            NAME="${FILENAME%.*}"
            SAFE_NAME="${NAME:0:$((MAX_LEN - 1 - ${#EXT}))}.${EXT}"
          else
            SAFE_NAME="$FILENAME"
          fi

          echo "📂 Nama upload: $SAFE_NAME"

          curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendDocument" \
            -F chat_id="${TELEGRAM_CHAT_ID}" \
            -F "document=@${ORIGINAL_FILE};filename=${SAFE_NAME}" \
            -F caption="$CAPTION" \
            -F parse_mode="MarkdownV2"
