name: Test Upload Telegram

on:
  workflow_dispatch:

jobs:
  test-upload:
    runs-on: ubuntu-latest
    steps:
      - name: Buat dummy ZIP
        run: |
          mkdir out
          echo "Hello Telegram" > out/hello.txt
          zip -j "out/Nikki_TProxy_v1.24.2-Mod-r1_Nikki_v1.19.13-Mod-r2_aarch64_generic.zip" out/hello.txt

      - name: Upload dummy ZIP ke Telegram
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          set -e
          ORIGINAL_FILE="out/Nikki_TProxy_v1.24.2-Mod-r1_Nikki_v1.19.13-Mod-r2_aarch64_generic.zip"

          echo "📦 Asli: $ORIGINAL_FILE"

          CAPTION="🧪 <b>Testing Upload</b>

          File: <code>$(basename "$ORIGINAL_FILE")</code>"

          # Pakai nama asli persis
          curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendDocument" \
            -F chat_id="${TELEGRAM_CHAT_ID}" \
            -F "document=@${ORIGINAL_FILE};filename=$(basename "$ORIGINAL_FILE")" \
            -F caption="$CAPTION" \
            -F parse_mode="HTML"
